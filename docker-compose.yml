version: '3.9'

services:

  # ── Go Backend ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ticker-backend
    ports:
      - "8080:8080"
    restart: unless-stopped

  # ── Vue Frontend ────────────────────────────────────
  frontend:
    build:
      context: ./ticker-app
      dockerfile: Dockerfile
    container_name: ticker-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped