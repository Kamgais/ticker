name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Frontend Tests & Build ─────────────────────────
  frontend:
    name: Frontend (Vue 3 + TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ticker-app/package-lock.json

      - name: Dependencies installieren
        working-directory: ticker-app
        run: npm ci

      - name: TypeScript prüfen
        working-directory: ticker-app
        run: npx tsc --noEmit

      - name: Tests ausführen
        working-directory: ticker-app
        run: npm run test

      - name: Production Build
        working-directory: ticker-app
        run: npm run build

  # ── Backend Build ──────────────────────────────────
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Go einrichten
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Dependencies installieren
        working-directory: backend
        run: go mod download

      - name: Build prüfen
        working-directory: backend
        run: go build ./...

      - name: Vet prüfen
        working-directory: backend
        run: go vet ./...

  # ── Docker Build & Push zu DockerHub ──────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: DockerHub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Frontend Image bauen und pushen
        uses: docker/build-push-action@v5
        with:
          context: ./ticker-app
          file: ./ticker-app/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ticker-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ticker-frontend:${{ github.sha }}

      - name: Backend Image bauen und pushen
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ticker-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ticker-backend:${{ github.sha }}